<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Retro CRT Monitor Outer Shell -->
  <rect x="6" y="8" width="52" height="42" rx="7" fill="#f5eedc" stroke="#2d2a26" stroke-width="3" />
  <!-- Beveled shading on casing -->
  <path d="M7 15 L57 15" stroke="#e6dbc5" stroke-width="2" />
  
  <!-- CRT Screen Bezel -->
  <rect x="11" y="13" width="42" height="31" rx="4" fill="#2d2a26" />
  
  <!-- CRT Glowing Screen Glass -->
  <rect x="13" y="15" width="38" height="27" rx="3" fill="#182230" />
  <rect x="14" y="16" width="36" height="25" rx="2" fill="#0ea5e9" opacity="0.9" />
  <!-- Screen scanlines / CRT curve glow -->
  <path d="M14 18 Q32 15 50 18" stroke="#38bdf8" stroke-width="1" opacity="0.6" fill="none" />
  <path d="M14 38 Q32 40 50 38" stroke="#0284c7" stroke-width="1.5" opacity="0.6" fill="none" />

  <!-- Funny Googly Eyes -->
  <!-- Left Eye: Big derpy eye -->
  <ellipse cx="23" cy="26" rx="6.5" ry="7" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
  <circle cx="24.5" cy="27" r="3.2" fill="#111827" />
  <circle cx="26" cy="25.5" r="1.2" fill="#ffffff" /> <!-- highlight -->

  <!-- Right Eye: Small funny mismatched eye -->
  <ellipse cx="39" cy="27" rx="5" ry="5.5" fill="#ffffff" stroke="#111827" stroke-width="1.8" />
  <circle cx="37.5" cy="28" r="2.4" fill="#111827" />
  <circle cx="38.5" cy="26.8" r="0.9" fill="#ffffff" /> <!-- highlight -->

  <!-- Cheek Blushes -->
  <ellipse cx="17" cy="33" rx="2.5" ry="1.2" fill="#fb7185" opacity="0.8" />
  <ellipse cx="45" cy="33" rx="2.5" ry="1.2" fill="#fb7185" opacity="0.8" />

  <!-- Derpy Mouth with Floppy Tongue sticking out :P -->
  <path d="M28 33 Q32 35 34 33" stroke="#111827" stroke-width="2" fill="none" stroke-linecap="round" />
  <!-- Tongue sticking out -->
  <path d="M30 34 C30 38, 35 38, 35 34 Z" fill="#ff4b72" stroke="#111827" stroke-width="1.2" />
  <line x1="32.5" y1="34" x2="32.5" y2="36.5" stroke="#9f1239" stroke-width="0.8" />

  <!-- Monitor Chin / Drive & Buttons -->
  <rect x="6" y="50" width="52" height="7" fill="#e5dac1" stroke="#2d2a26" stroke-width="3" />
  <!-- Floppy drive slot -->
  <rect x="12" y="52" width="16" height="2.5" rx="1" fill="#2d2a26" />
  <circle cx="33" cy="53.5" r="1.5" fill="#22c55e" /> <!-- Green LED -->
  <circle cx="38" cy="53.5" r="1.5" fill="#ef4444" /> <!-- Red LED -->
  <rect x="44" y="52" width="9" height="3" rx="1" fill="#a89f8d" stroke="#2d2a26" stroke-width="1" /> <!-- Power Button -->

  <!-- Monitor Stand Base -->
  <path d="M22 57 L42 57 L46 62 L18 62 Z" fill="#d6cbb1" stroke="#2d2a26" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Top Antenna with Spark -->
  <path d="M32 8 L32 2" stroke="#2d2a26" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="32" cy="2" r="3" fill="#facc15" stroke="#2d2a26" stroke-width="1.5" />
  <!-- Spark lines -->
  <path d="M28 0 L30 1" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
  <path d="M36 0 L34 1" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
</svg>